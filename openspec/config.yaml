schema: spec-driven

context: |
  Tech stack: Rust, axum, htmx, PostgreSQL, and TimescaleDB
  Domain: eve online tooling
  Planning workflow: when exploring, proposing or reviewing a change, use the grilling skill to settle open decisions with the user before writing artifacts or conclusions.

rules:
  proposal:
    - Use the grilling skill to settle open decisions with the user before writing the proposal
  tasks:
    - Break tasks into chunks of max 2 hours
    - Every UI task includes a Playwright test

operations:
  apply:
    guidance:
      - Use the tdd skill
      - Set ports on testing to leave the dev running
      - Restrict npx playwright with `npx playwright test --workers=1`
      - Restrict cargo test with `CARGO_BUILD_JOBS=3 RUST_TEST_THREADS=3 nice -n 19 cargo test`
      - Run tests sequentially always
      - All tests must be green
      - Keep test summaries concise
      - Do not commit
