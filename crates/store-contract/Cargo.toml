[package]
name = "store-contract"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "store-verify"
path = "src/bin/store-verify.rs"

[features]
# The migration and schema tests, which need a PostgreSQL with TimescaleDB.
postgres = []

[[test]]
name = "memory"
path = "tests/memory.rs"
harness = false

[dependencies]
async-trait = "0.1.92"
dotenvy = "0.15"
futures-util = "0.3.34"
secrecy = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sekondo = { path = "../sekondo", features = ["memory-store"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono", "macros", "time"] }
time = { version = "0.3.55", features = ["serde-well-known", "parsing", "formatting", "macros"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
tower-sessions = "0.15.0"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
libtest-mimic = "0.8"
tempfile = "3.27.0"
