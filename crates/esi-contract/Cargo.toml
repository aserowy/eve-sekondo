[package]
name = "esi-contract"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "stub-fingerprint"
path = "src/bin/stub-fingerprint.rs"

[dependencies]
base64 = "0.22"
http = "1"
httpdate = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["parsing"] }

[dev-dependencies]
tempfile = "3.27.0"
