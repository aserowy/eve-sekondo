<div class="table-wrap">
<table class="orders">
  <thead>
    <tr>
      {% for h in table.headers %}
      <th scope="col"{% if !h.aria_sort.is_empty() %} aria-sort="{{ h.aria_sort }}"{% endif %}><a href="{{ h.href }}" hx-get="{{ h.href }}" hx-target="#orders-view" hx-select="#orders-view" hx-select-oob="#main-nav" hx-swap="outerHTML" hx-push-url="true">{{ h.label }}{{ h.arrow }}</a></th>
      {% endfor %}
    </tr>
  </thead>
  <tbody>
    {% for r in table.rows %}
    <tr id="order-{{ r.order_id }}">
      <td>{{ r.character }}{% if r.is_corporation %} <mark class="badge corp">Corp</mark>{% endif %}</td>
      <td>{{ r.item }}</td>
      <td>{{ r.location }}</td>
      <td>{{ r.region }}</td>
      <td class="num" title="{{ r.price_exact }}">{{ r.price }}</td>
      <td class="num">{{ r.volume }}</td>
      <td class="num" title="{{ r.amount_exact }}">{{ r.amount }}</td>
      <td>{{ r.issued }}</td>
      <td>{{ r.left }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
