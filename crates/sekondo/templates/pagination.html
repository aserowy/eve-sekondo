{% if pager.total > 0 %}
<nav class="pagination" aria-label="Pagination">
  {% if let Some(prev) = pager.prev %}<a href="{{ prev.href }}" rel="prev" hx-get="{{ prev.content }}" hx-target="#content" hx-sync="#content:replace" hx-swap="innerHTML show:#content:top" hx-push-url="{{ prev.href }}">Previous</a>{% else %}<span aria-disabled="true">Previous</span>{% endif %}
  <span class="page-label">{{ pager.label }}</span>
  {% if let Some(next) = pager.next %}<a href="{{ next.href }}" rel="next" hx-get="{{ next.content }}" hx-target="#content" hx-sync="#content:replace" hx-swap="innerHTML show:#content:top" hx-push-url="{{ next.href }}">Next</a>{% else %}<span aria-disabled="true">Next</span>{% endif %}
  <label>Rows per page
    <select data-page-size{% if let Some(save) = pager.save %} data-save="{{ save }}"{% endif %} aria-label="Rows per page">
      {% for size in pager.sizes %}<option value="{{ size.value }}" data-href="{{ size.link.href }}" data-content="{{ size.link.content }}"{% if size.selected %} selected{% endif %}>{{ size.value }}</option>
      {% endfor %}
    </select>
  </label>
</nav>
{% endif %}
