<form id="opportunity-filters" class="filters" data-view-state data-invalid-target="#filter-error" hx-post="/opportunities/settings" hx-trigger="change" hx-target="#content" hx-sync="#content:replace" hx-swap="innerHTML show:#content:top">
  <input type="hidden" name="chars" value="{{ view.filters.chars }}">
  <input type="hidden" name="table" value="{{ view.filters.table }}">
  <input type="hidden" name="per_page" value="{{ view.filters.per_page }}">
  {% for (name, value) in view.filters.sorts %}
  <input type="hidden" name="{{ name }}" value="{{ value }}">
  {% endfor %}
  <label>Minimum margin (%) <input type="text" inputmode="decimal" name="min_margin" value="{{ view.filters.form.min_margin }}"></label>
  <label>Minimum ISK/day <input type="text" inputmode="decimal" name="min_isk_per_day" value="{{ view.filters.form.min_isk_per_day }}"></label>
  <label>Item name <input type="search" name="search" value="{{ view.filters.form.search }}" maxlength="100"></label>
  <label>Capital per item (ISK) <input type="text" inputmode="decimal" name="capital" value="{{ view.filters.form.capital }}"></label>
</form>
