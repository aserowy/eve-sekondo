[package]
name = "sekondo"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sekondo"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
askama = "0.16.1"
async-trait = "0.1.92"
axum = "0.8"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.22"
dotenvy = "0.15"
futures-util = "0.3.34"
httpdate = "1.0.3"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rustls = "0.23.46"
secrecy = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono", "macros", "time"] }
subtle = "2.6.1"
thiserror = "2"
time = { version = "0.3.55", features = ["serde-well-known", "parsing", "formatting"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
base64 = "0.22"
esi-contract = { path = "../esi-contract" }
http = "1"
eve-stub = { path = "../eve-stub" }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
serde_json = "1.0.154"
tempfile = "3"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }

[features]
# Adds POST /_test/refresh/{id} for the Playwright suite. Never enabled in release builds.
test-hooks = []
