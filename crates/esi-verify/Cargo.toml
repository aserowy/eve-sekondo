[package]
name = "esi-verify"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "esi-verify"
path = "src/main.rs"

[dependencies]
axum = "0.8"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
dotenvy = "0.15"
esi-contract = { path = "../esi-contract" }
http = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
secrecy = "0.10"
sekondo = { path = "../sekondo" }
serde = "1.0.229"
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time", "process"] }
url = "2"

[dev-dependencies]
eve-stub = { path = "../eve-stub" }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
