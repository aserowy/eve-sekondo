[package]
name = "eve-stub"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "eve-stub"
path = "src/main.rs"

[dependencies]
aws-lc-rs = "1.18.2"
axum = "0.8"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.1"
rand = "0.10.3"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "form"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
url = "2.5.8"

[dev-dependencies]
base64 = "0.23.1"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"
